name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      # livewire/flux-pro is served from Flux's private Composer repository.
      # The same secrets have to exist in the Dependabot secret store as well,
      # otherwise Composer fails on Dependabot's own pull requests.
      - name: Authenticate with the Flux repository
        run: composer config --global http-basic.composer.fluxui.dev "${{ secrets.FLUX_PRO_USERNAME }}" "${{ secrets.FLUX_PRO_PASSWORD }}"

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # public/build is not committed, but the layouts resolve their assets
      # through @vite, so the manifest has to exist before anything renders.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  rector:
    name: Rector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Authenticate with the Flux repository
        run: composer config --global http-basic.composer.fluxui.dev "${{ secrets.FLUX_PRO_USERNAME }}" "${{ secrets.FLUX_PRO_PASSWORD }}"

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v4

      - name: Rector
        run: vendor/bin/rector process --dry-run

  lint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Authenticate with the Flux repository
        run: composer config --global http-basic.composer.fluxui.dev "${{ secrets.FLUX_PRO_USERNAME }}" "${{ secrets.FLUX_PRO_PASSWORD }}"

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v4

      - name: Pint
        run: vendor/bin/pint --test
